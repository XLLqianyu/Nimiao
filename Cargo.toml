[workspace]
resolver = "2"
members = [
    "protocol", "sandbox", "execpolicy", "tools", "model",
    "engine", "nimiao-cli"
]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "Apache-2.0 WITH Commons-Clause"
repository = "https://github.com/XLLqianyu/Nimiao"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
shlex = "1.3"
