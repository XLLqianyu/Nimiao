# cargo-deny configuration: dependency licenses, advisory database, and sources.
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Permissive licenses only. Add entries deliberately, after review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

# Workspace crates carry a custom license condition alongside Apache-2.0, which
# SPDX cannot express. They are `publish = false`, so only third-party
# dependencies are subject to this policy.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry no version requirement, which Cargo resolves
# to `*`. They are not publishable, so that is intentional rather than a
# wildcard dependency on the registry.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
