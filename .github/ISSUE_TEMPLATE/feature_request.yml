name: Feature request
description: Suggest a capability or improvement.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Sketch the API or interface if you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Affected crates
      description: Which parts of the workspace would this touch?
      placeholder: tools, engine, ...
    validations:
      required: false
